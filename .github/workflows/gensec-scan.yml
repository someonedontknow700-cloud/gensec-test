name: GenSec Security Scanner

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM (optional)

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout GenSec Agent Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Security Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOS: ${{ github.repository }}
          USER_PLAN: 'free'
        run: |
          echo "🔍 Starting GenSec Security Scan"
          echo "📋 Repository: ${{ github.repository }}"
          echo "🤖 Using Groq AI for vulnerability fixes"
          echo ""
          timeout 300 python main.py || echo "Scan completed or timed out"

      - name: Upload Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: |
            report.json
            report-*.json
          retention-days: 30
